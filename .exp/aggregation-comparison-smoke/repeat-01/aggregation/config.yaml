system:
  shard_num: 4
  node_num: 4
  limit: 5000
  consensus_type: "static_relay"
  log:
    log_dir: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/logs/"
    log_level: "info"

consensus_node:
  blockchain:
    bloom_filter:
      bitset_len: 4096
      filter_hash_func: [sha256, sha512, sha1]
    storage:
      block_storage_type: "bolt"
      trie_storage_type: "eth_level_db"
      bolt:
        file_path_dir: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/boltdb/"
      eth_storage:
        is_memory_db: true
        level_file_path_dir: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/trie_db/"
        old_state_root: ""
    vm:
      chain_id: 11
      vm_state_dir: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/vm_state/"
  tx_pool:
    type: "number"
  block_interval: 2000
  block_record_dir: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/block_record/"

aggregation:
  enabled: true
  metrics_enabled: true
  batch_size: 1000
  credit_chunk_size: 500
  max_window_duration_ms: 2000
  beacon_store_path: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/beacon/beacon.db"
  max_aggregation_window: 0
  max_aggregation_injection_duration_ms: 0

supervisor:
  tx_number: 100
  tx_injection_speed: 20000
  result_output_dir: "./.exp/aggregation-comparison-smoke/repeat-01/aggregation/results/"
  epoch_duration: 50
  tx_source:
    tx_source_type: "csv_source"
    tx_source_file: "./data/25250000to25499999_BlockTransaction.csv"
    exclude_contract_txs: true
  broker_module:
    broker_file_path: "./pkg/broker/broker"
    broker_num: 50

network:
  bandwidth: 1000000
  latency: 0
  communication_mode: "direct"
  libp2p:
    bootstrap_key_fp: "./pkg/network/connlibp2p/bootstrap.key"
    bootstrap_peer: "12D3KooWR6siPMZ2sMFKbgwaJFwQfnKczuPZnxHfyy1dHTzZSAUY"
    bootstrap_ip: "127.0.0.1"
    bootstrap_port: 12345
